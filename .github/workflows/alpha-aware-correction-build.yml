name: Alpha-aware correction build

on:
  push:
    branches:
      - feature/alpha-aware-color-correction

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply alpha-aware patch
        run: python scripts/apply-alpha-aware-correction.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm scripts/apply-alpha-aware-correction.py
          rm .github/workflows/alpha-aware-correction-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make smart color correction alpha-aware" || exit 0
          git push origin HEAD:feature/alpha-aware-color-correction
