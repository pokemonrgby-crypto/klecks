name: Smart correction v3 build

on:
  push:
    branches:
      - feature/smart-correction-v3

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/smart-correction-v3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v3 patch
        run: python scripts/apply-smart-correction-v3.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          rm scripts/apply-smart-correction-v3.py
          rm .github/workflows/smart-correction-v3-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement smart correction v3" || exit 0
          git push origin HEAD:feature/smart-correction-v3
