name: Repair drawing features

on:
  push:
    branches:
      - fix/smart-stroke-and-color-cleanup

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/smart-stroke-and-color-cleanup

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch drawing features
        run: python .github/repair_drawing_features.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit repaired implementation
        shell: bash
        run: |
          rm .github/workflows/repair-drawing-features.yml
          rm .github/repair_drawing_features.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix smart stroke correction and add color spill cleanup"
          git push origin HEAD:fix/smart-stroke-and-color-cleanup
